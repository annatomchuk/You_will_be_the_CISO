                        Ви — CISO у великій логістичній технологічній компанії, яка через 3 місяці проходить зовнішній сертифікаційний аудит за стандартом <strong>ISO/IEC 27001:2022</strong>, щоб виграти державний тендер. Під час попереднього перегляду внутрішніх процесів ви виявили низку деталей:

                        <li>У компанії немає окремого «Департаменту інформаційної безпеки» — за безпеку відповідають тімліди розробки, але їм не надали повноважень зупиняти релізи або вимагати бюджет на захист.</li>
                        <li>Для оцінки ризиків команда використовує 3-рівневу шкалу (Низький/Середній/Високий) замість класичної матриці 5&times;5, а всі 93 заходи з Додатка А зафіксовані в системі Jira як задачі, хоча частина з них (наприклад, фізична безпека власних дата-центрів) виключена без письмового пояснення, бо сервери повністю у хмарі AWS.</li>
                        <li>Документована інформація ведеться не у файлах Word, а у вигляді електронних заявок та робочих процесів у системі GRC, проте в компанії жодного разу не проводився внутрішній аудит перед зовнішньою перевіркою.</li>
                    </ul>
                    <p class="text-sm font-medium text-slate-900 pt-1">Оберіть варіант аналізу, який точно визначає три реальні невідповідності стандарту ISO/IEC 27001:</p>

                    },
                    {
                        id: "B",
                        label: "Варіант B: Делегування на тімлідів, неповні 93 заходи та відсутність аудиту",
                        desc: "Відповідальність покладена на тімлідів без створення окремого департаменту (порушення Розділу 5); виключено частину заходів Додатка А, хоча потрібно впровадити всі 93 без винятків; внутрішній аудит не проводився (Розділ 9).",

                        trustClass: "text-rose-700",
                        costText: "$75,000 (Залишок: $25,000)",
                        riskClass: "text-rose-700",
                        takeaway: "❌ Частково хибний аналіз. Ви правильно помітили відсутність внутрішнього аудиту, але припустилися двох грубих помилок: стандарт дозволяє гнучку оргструктуру (можна розподіляти ролі між тімлідами, якщо є повноваження) і дозволяє виключати заходи з Додатка А, якщо це належним чином обґрунтовано в Заяві про застосовність (SoA)."

                    {
                        id: "C",

                    }
                ]
            }
        }
    };

    let currentModuleId = 1;
    let answeredQuestions = { 1: {}, 2: {} };
    let selectedDecisions = { 1: null, 2: null };

    function switchModule(modId) {
        currentModuleId = modId;

        [1, 2].forEach(id => {
            const btn = document.getElementById('mod-btn-' + id);
            if (id === modId) {
                btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-[#122d55] text-white shadow-sm";
            } else {
                btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700 hover:bg-slate-200";
            }
        });

        renderModuleContent();
    }

    function renderModuleContent() {
        const mod = modulesData[currentModuleId];

        // 1. Render Lecture
        document.getElementById('lecture-container').innerHTML = mod.lectureHTML;

        // 2. Render Practice
        document.getElementById('practice-badge').innerText = mod.practiceBadge;
        document.getElementById('practice-title').innerText = mod.practiceTitle;
        renderQuiz();

        // 3. Render Simulator
        const sim = mod.simulator;
        const simContainer = document.getElementById('simulator-container');
        const optionsHtml = sim.options.map(opt => `
            <button onclick="makeDecision('${opt.id}')" id="sim-btn-${opt.id}" class="w-full p-5 border border-slate-300 rounded-xl hover:border-blue-600 hover:bg-blue-50/30 transition text-left space-y-2">
                <div class="font-bold text-slate-900">${opt.label}</div>
                <p class="text-xs text-slate-600">${opt.desc}</p>
            </button>
        `).join('');

        simContainer.innerHTML = `
            <div class="border-b border-slate-200 pb-4 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <span class="text-xs font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded uppercase">${sim.badge}</span>
                    <h2 class="text-xl font-bold text-slate-900 mt-2">${sim.title}</h2>
                </div>
                <button onclick="resetSimulator()" class="text-xs font-medium text-slate-500 hover:text-slate-800 underline">
                    Скинути симуляцію
                </button>
            </div>
            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-2">
                <div class="text-xs font-bold uppercase tracking-wider text-[#122d55]">Опис дилеми</div>
                ${sim.contextHTML}
            </div>
            <div class="space-y-4">${optionsHtml}</div>
            <div id="sim-feedback" class="hidden p-6 rounded-xl text-sm border space-y-3"></div>
        `;

        if (selectedDecisions[currentModuleId]) {
            makeDecision(selectedDecisions[currentModuleId]);
        } else {
            updateDashboardMetrics({ security: 65, trust: 75, budget: 100000, risk: 'Високий' });
        }
    }

    function renderQuiz() {
        const mod = modulesData[currentModuleId];
        const container = document.getElementById('quiz-container');
        const currentAnswers = answeredQuestions[currentModuleId];
        container.innerHTML = '';

        mod.quizzes.forEach((q, qIndex) => {
            const qBlock = document.createElement('div');
            qBlock.className = "p-6 bg-slate-50 rounded-xl border border-slate-200 space-y-4";

            let optionsHtml = q.options.map((opt, oIndex) => {
                let btnStyle = "border-slate-300 bg-white hover:border-blue-500 hover:bg-blue-50/40 text-slate-800";
                if (currentAnswers[qIndex] !== undefined) {
                    if (oIndex === q.correct) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                    } else if (oIndex === currentAnswers[qIndex]) {
                        btnStyle = "border-rose-400 bg-rose-50 text-rose-900";
                    } else {
                        btnStyle = "border-slate-200 bg-white text-slate-400";
                    }
                }
                return `
                    <button onclick="selectAnswer(${qIndex}, ${oIndex})" class="w-full p-3.5 text-left border rounded-lg transition text-sm ${btnStyle}">
                        ${opt}
                    </button>
                `;
            }).join('');

            let takeawayHtml = '';
            if (currentAnswers[qIndex] !== undefined) {
                const isCorrect = currentAnswers[qIndex] === q.correct;
                takeawayHtml = `
                    <div class="p-4 rounded-lg text-xs border ${isCorrect ? 'bg-emerald-50/80 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}">
                        <strong>${isCorrect ? '✅ Правильно!' : '❌ Невірно.'} Takeaway:</strong> ${q.takeaway}
                    </div>
                `;
            }

            qBlock.innerHTML = `
                <div class="font-semibold text-slate-900 text-sm">${q.question}</div>
                <div class="space-y-2.5">${optionsHtml}</div>
                ${takeawayHtml}
            `;
            container.appendChild(qBlock);
        });

        document.getElementById('quiz-progress').innerText = `${Object.keys(currentAnswers).length} / ${mod.quizzes.length}`;
    }

    function selectAnswer(qIndex, oIndex) {
        answeredQuestions[currentModuleId][qIndex] = oIndex;
        renderQuiz();
    }

    function resetQuiz() {
        answeredQuestions[currentModuleId] = {};
        renderQuiz();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');

        ['lectures', 'tests', 'simulator'].forEach(id => {
            const btn = document.getElementById('tab-btn-' + id);
            if (id === tabId) {
                btn.className = "px-5 py-2 rounded-md text-xs font-semibold tracking-wide transition-all text-white bg-blue-600 shadow";
            } else {
                btn.className = "px-5 py-2 rounded-md text-xs font-semibold tracking-wide transition-all text-slate-300 hover:text-white";
            }
        });
    }

    function makeDecision(optionId) {
        selectedDecisions[currentModuleId] = optionId;
        const sim = modulesData[currentModuleId].simulator;
        const opt = sim.options.find(o => o.id === optionId);
        if (!opt) return;

        sim.options.forEach(o => {
            const btn = document.getElementById('sim-btn-' + o.id);
            if (btn) btn.classList.remove('ring-2', 'ring-blue-600', 'bg-blue-50/40');
        });
        const activeBtn = document.getElementById('sim-btn-' + optionId);
        if (activeBtn) activeBtn.classList.add('ring-2', 'ring-blue-600', 'bg-blue-50/40');

        const fb = document.getElementById('sim-feedback');
        fb.className = `p-6 rounded-xl text-sm border space-y-3 ${opt.style}`;
        fb.innerHTML = `
            <div class="font-bold ${opt.titleColor}">${opt.label}</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 py-2 text-xs font-semibold">
                <div class="bg-white p-2.5 rounded border border-slate-200">🤝 Business Trust: <span class="${opt.trustClass}">${opt.trustText}</span></div>
                <div class="bg-white p-2.5 rounded border border-slate-200">💰 Витрати: <span class="text-slate-900">${opt.costText}</span></div>
                <div class="bg-white p-2.5 rounded border border-slate-200">⚠️ Risk Level: <span class="${opt.riskClass}">${opt.metrics.risk}</span></div>
            </div>
            <p class="text-slate-800"><strong>💡 CISO Takeaway:</strong> ${opt.takeaway}</p>
        `;

        updateDashboardMetrics(opt.metrics);
    }

    function updateDashboardMetrics(m) {
        document.getElementById('metric-security').innerText = m.security + '%';
        document.getElementById('metric-trust').innerText = m.trust + '%';
        document.getElementById('metric-budget').innerText = '$' + m.budget.toLocaleString();
        document.getElementById('metric-risk').innerText = m.risk;
    }

    function resetSimulator() {
        selectedDecisions[currentModuleId] = null;
        renderModuleContent();
    }

    // Ініціалізація при завантаженні
    renderModuleContent();
</script>
</body>
</html>
